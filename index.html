<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caf8nity — Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="page">
        <div class="bula">
            <span id="mensahe">Hello! Mag-register na tayo 😊</span>
        </div>

        <div class="antenna">
            <div class="tuldok"></div>
        </div>

        <div class="robot">
            <div class="ulo">
                <div class="loob">
                    <div class="mata">
                        <div class="eye" id="kaliwa"><div class="pupil"></div></div>
                        <div class="eye" id="kanan"><div class="pupil"></div></div>
                    </div>
                    <div class="bibig" id="bibig">
                        <div class="loob-bibig"></div>
                    </div>
                </div>
            </div>
<div class="kamay">
    <span class="kaliwa"></span>
    <span class="kanan"></span>
</div>

        <div class="kahon">
            <h2>Join Caf8nity</h2>
            <form id="form">
                <div class="hanay">
                    <div class="larangan">
                        <input type="text" id="firstname" required placeholder=" "
                            onfocus="palit('Ano ang pangalan mo? 📝'); buksanBibig()"
                            onblur="palit('Hello! Mag-register na tayo 😊'); isaraBibig()"
                            oninput="bibilisBibig()">
                        <label>First Name</label>
                    </div>
                    <div class="larangan">
                        <input type="text" id="middlename" placeholder=" "
                            onfocus="palit('May middle name ka ba? Opsyonal lang'); buksanBibig()"
                            onblur="palit('Hello! Mag-register na tayo 😊'); isaraBibig()"
                            oninput="bibilisBibig()">
                        <label>Middle Name (Optional)</label>
                    </div>
                </div>
                <div class="hanay">
                    <div class="larangan">
                        <input type="text" id="lastname" required placeholder=" "
                            onfocus="palit('Apelyido naman 👋'); buksanBibig()"
                            onblur="palit('Hello! Mag-register na tayo 😊'); isaraBibig()"
                            oninput="bibilisBibig()">
                        <label>Last Name</label>
                    </div>
                    <div class="larangan">
                        <input type="tel" id="phonenumber" required placeholder=" "
                            onfocus="palit('Contact number mo 📱'); buksanBibig()"
                            onblur="palit('Hello! Mag-register na tayo 😊'); isaraBibig()"
                            oninput="bibilisBibig()">
                        <label>Phone / Number</label>
                    </div>
                </div>
                <div class="larangan buo">
                    <input type="text" id="address" required placeholder=" "
                        onfocus="palit('Saan ka nakatira? 🏠'); buksanBibig()"
                        onblur="palit('Hello! Mag-register na tayo 😊'); isaraBibig()"
                        oninput="bibilisBibig()">
                    <label>Complete Address</label>
                </div>
                <div class="hanay">
                    <div class="larangan">
                        <input type="email" id="email" required placeholder=" "
                            onfocus="palit('Email mo para padalhan ka natin 📧'); buksanBibig()"
                            onblur="palit('Hello! Mag-register na tayo 😊'); isaraBibig()"
                            oninput="bibilisBibig()">
                        <label>Email Address</label>
                    </div>
                    <div class="larangan">
                        <input type="date" id="birthday" required placeholder=" "
                            onfocus="palit('Kailan ang birthday mo? May regalo tayo! 🎂'); buksanBibig()"
                            onblur="palit('Hello! Mag-register na tayo 😊'); isaraBibig()">
                        <label>Birthday</label>
                    </div>
                </div>
                <div class="larangan buo">
                    <select id="payment" required onchange="bayad(this.value)">
                        <option value=""></option>
                        <option value="cash">Cash</option>
                        <option value="gcash">GCash</option>
                    </select>
                    <label>Preferred Payment Method</label>
                </div>
                <button type="submit">Register Now</button>
            </form>
        </div>

        <div class="paa">
            <span class="kaliwa"></span>
            <span class="kanan"></span>
        </div>
    </div>

    <script>
        const GCASH = "0917-123-4567"; // ← PALITAN MO ITO NG TOTOONG NUMBER MO

       const SUPABASE_URL = "https://ctjbpswnrboigfghpbxy.supabase.co";
       const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0amJwc3ducmJvaWdmZ2hwYnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTc3ODksImV4cCI6MjEwMjE3Mzc4OX0.YTy404CTIHXQfFnEL5N1sM9-9gbEzTZBWVqSIn8F1cM";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
       function palit(t) { document.getElementById('mensahe').textContent = t; }
        function bayad(v) {
            if (v === 'gcash') { palit(`GCash: ${GCASH} 💚`); buksanBibig(); }
            else if (v === 'cash') { palit('Sige, magbayad tayo sa pagkuha! 💵'); buksanBibig(); }
            else { palit('Paano mo gustong magbayad? 💳'); isaraBibig(); }
        }

        // GALAW NG BIBIG
        const bibig = document.getElementById('bibig');
        let mabilis = null;

        function buksanBibig() {
            bibig.classList.add('bukas');
        }
        function isaraBibig() {
            bibig.classList.remove('bukas', 'nagsasalita');
            if (mabilis) clearInterval(mabilis);
        }
        function bibilisBibig() {
            bibig.classList.add('nagsasalita');
            if (mabilis) return;
            mabilis = setInterval(() => {
                if (!bibig.classList.contains('nagsasalita')) {
                    clearInterval(mabilis);
                    mabilis = null;
                    return;
                }
                bibig.classList.toggle('bukas');
            }, 150);
        }

        document.getElementById('form').addEventListener('submit', async e => {
            e.preventDefault();
            const data = {
                firstname: document.getElementById('firstname').value,
                middlename: document.getElementById('middlename').value || null,
                lastname: document.getElementById('lastname').value,
                phonenumber: document.getElementById('phonenumber').value,
                address: document.getElementById('address').value,
                email: document.getElementById('email').value,
                birthday: document.getElementById('birthday').value,
                paymentmethod: document.getElementById('payment').value
            };
            palit('Salamat! ✅');
            buksanBibig();
            const { error } = await db.from('vip_members').insert([data]);
            if (error) {
                alert("May mali: " + error.message);
                palit('Subukan mo ulit 😅');
                isaraBibig();
            } else {
                alert("Registered Successfully! ✅");
                e.target.reset();
                setTimeout(() => {
                    palit('Hello! Mag-register na tayo 😊');
                    isaraBibig();
                }, 2500);
            }
        });

        document.addEventListener('mousemove', e => {
            ['kaliwa', 'kanan'].forEach(id => {
                const eye = document.getElementById(id);
                const pupil = eye.querySelector('.pupil');
                const r = eye.getBoundingClientRect();
                const cx = r.left + r.width/2, cy = r.top + r.height/2;
                const ag = Math.atan2(e.clientY - cy, e.clientX - cx);
                const layo = Math.min(3, Math.hypot(e.clientX - cx, e.clientY - cy)/40);
                pupil.style.transform = `translate(calc(-50% + ${Math.cos(ag)*layo}px), calc(-50% + ${Math.sin(ag)*layo}px))`;
            });
        });
    </script>
</body>
</html>
